[package]
name = "zcash_voting"
version = "5.2.0-rc.2"
edition = "2021"
rust-version = "1.97"
description = "Client-side library for Zcash shielded voting: ZKP delegation and vote-commitment proofs (Halo 2), ElGamal encryption, governance PCZT construction, Merkle witness generation, and SQLite round-state persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = ["lrz"]
# Compat no-op: this crate is single-stack LRZ (upstream librustzcash 0.31).
# Kept so existing `features = ["lrz"]` wiring keeps working.
lrz = []
# Wallet-database slice: re-exports `zcash_client_sqlite` and enables the
# WalletDb-taking APIs (note selection, witnesses, delegation bundle
# preparation, the delegation pipeline). Opt-in so a consumer that supplies
# its own wallet storage keeps `zcash_client_sqlite` — and the rusqlite
# generation it pins — out of the resolve entirely.
wallet-db = ["dep:zcash_client_sqlite"]
test-fixtures = []

[dependencies]
rand = "0.8"
futures-util = "0.3"
rayon = "1.12"
blake2b_simd = "1"
voting-crypto-deps = { workspace = true }

base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
prost = "0.14"
sha2 = "0.10"
ed25519-dalek = "2"

pir-client = { version = "=0.9.0", default-features = false, features = ["upstream"] }
pir-types = { version = "=0.8.0", default-features = false, features = ["upstream"] }
valar-spiral-rs = { version = "=0.5.3-rc.1", default-features = false }
valar-ypir = { version = "=0.2.1", default-features = false }
imt-tree = { version = "=0.7.0", default-features = false, features = ["upstream"] }

bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"] }

vote-commitment-tree = { path = "../vote-commitment-tree", version = "=0.8.0" }
vote-commitment-tree-client = { path = "../vote-commitment-tree-client", version = "=0.10.0", features = ["http"] }

# Tolerant range, deliberately not a pin: the rusqlite generation is decided
# by the consumer's graph. zingolib pins =0.32.1 (the libsqlite3-sys 0.30.x
# mapping its workspace is welded to via sqlx), so there zcash_voting resolves
# at 0.32.1; here it floats to 0.37 to match zcash_client_sqlite 0.23. The
# storage layer compiles against both generations unchanged.
rusqlite = { version = ">=0.32, <0.38", features = ["bundled"] }

anyhow = "1"
thiserror = "2"
zeroize = "1"

subtle = "2.6"
voting-circuits = { workspace = true }
nonempty = "0.11"

# Upstream librustzcash 0.31 cohort. Feature sets mirror what the
# `zakura-wallet-lib` facade used to enable for the LRZ stack.
orchard = { version = "0.16", features = ["circuit", "unstable-voting-circuits"] }
pczt = { version = "0.10", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_primitives = { version = "0.31", default-features = false }
zcash_keys = { version = "0.17", features = ["orchard"] }
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.23", optional = true, default-features = false, features = ["orchard"] }
zcash_protocol = { workspace = true }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
secrecy = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower-service = "0.3"

# Smoke-only CLI invoked by tests/pir-smoke.sh / `make pir-smoke`.
# An example target keeps Cargo test filters from being forwarded as commands.
[[example]]
name = "pir_smoke"
path = "examples/pir_smoke.rs"
test = false

[workspace]
members = [
    "recovery-conformance",
    "stage-bench",
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# The default root build is the Zakura application path. LRZ and the
# lower-level VCT packages are validated in separate invocations because their
# backend features are mutually exclusive within one Cargo resolve.
default-members = [
    "zcash_voting",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
voting-circuits = { version = "=0.14.0", default-features = false }
voting-crypto-deps = { version = "=0.4.0", default-features = false }
# Zakura 4.0 publishes protocol as `zakura-protocol` with lib name `zcash_protocol`.
# Packages select one of these through the `zakura` / `lrz` features.
zcash_protocol = { version = "=4.0.0", package = "zakura-protocol", default-features = false }
lrz_zcash_protocol = { version = "0.11.0", package = "zcash_protocol" }

# Local forks and test-only vendored copies used while porting the LRZ stack.
# `zakura-wallet-lib` is a zingolabs fork of the facade with the LRZ
# wallet-database slice split into the opt-in `lrz-client-sqlite` feature; the
# two vendored librustzcash sqlite crates are re-based onto rusqlite 0.32 so
# the `lrz` + `wallet-db` test builds unify at libsqlite3-sys 0.30.x instead of
# conflicting with rusqlite 0.37's libsqlite3-sys 0.35 on `links = "sqlite3"`.
[patch.crates-io]
zakura-wallet-lib = { path = "fork/zakura-wallet-lib" }
zcash_client_sqlite = { path = "fork/vendored/zcash_client_sqlite-0.23.0" }
zakura-client-sqlite = { path = "fork/vendored/zakura-client-sqlite-0.1.0-rc9.5" }
schemerz-rusqlite = { path = "fork/vendored/schemerz-rusqlite-0.371.0" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3

# Debug info dominates link time across the ~900-test suite and is the main
# reason `target/` grows without bound. Line tables preserve backtraces and
# panic locations; full DWARF for third-party crates buys nothing locally.
# CI achieves the same for one job via CARGO_PROFILE_TEST_DEBUG=0.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

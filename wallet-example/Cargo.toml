[package]
name = "zcash-voting-wallet-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["wallet-db"]
# Application crate: drives the WalletDb-taking delegation pipeline, so the
# seam is on by default.
wallet-db = ["zcash_voting/wallet-db"]

[dependencies]
zeroize = "1"
anyhow = "1"
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voting-crypto-deps = { workspace = true }
zcash_protocol = { workspace = true }
zcash_voting = { path = "../zcash_voting", default-features = false }
